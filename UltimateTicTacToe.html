<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#faf7f0">
    <title>Ultimate TicTacToe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SharedStyle.css">
    <link rel="stylesheet" href="UltimateTicTacToeStyle.css">
    <script src="Theme.js"></script>
</head>
<body data-game="ultimate">
    <main class="gameContainer">
        <h1 class="title">Ultimate Tic Tac Toe</h1>
        <div class="optionsRow">
            <select id="modeSelect" aria-label="Game mode">
                <option value="two">2 Players</option>
                <option value="computer">vs Computer</option>
                <option value="online">Online</option>
            </select>
            <select id="difficultySelect" aria-label="Computer difficulty" hidden>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="impossible">Impossible</option>
            </select>
            <select id="sideSelect" aria-label="Your side" hidden>
                <option value="X">Play as X</option>
                <option value="O">Play as O</option>
            </select>
        </div>
        <div id="roomBar" class="roomBar" hidden>
            <span id="spectatorBadge" class="spectatorBadge" hidden>Spectator Mode</span>
            <span class="roomTag">Room <strong id="barCode"></strong></span>
            <span class="chip"><span id="barYouDot" class="dot" aria-hidden="true"></span><span id="barYou"></span></span>
            <span class="chip"><span id="barOppDot" class="dot" aria-hidden="true"></span><span id="barOpp"></span></span>
            <span class="chip chipSmall" id="barSpectators" title="People watching this match">Spectators: 0/3</span>
        </div>
        <section id="onlinePanel" class="onlinePanel" hidden aria-label="Online game">
            <div id="onlineStart" class="onlineCard">
                <h2>Play online</h2>
                <p class="onlineHint">Make a private room and send the code to a friend, or type a code to join theirs.</p>
                <button id="createRoomBtn" class="btn primary" type="button">Create room</button>
                <div class="orLine" aria-hidden="true"><span>or</span></div>
                <div class="joinRow">
                    <input id="roomCodeInput" type="text" maxlength="7" placeholder="Room code" autocomplete="off"
                           autocapitalize="characters" spellcheck="false" aria-label="Room code">
                    <button id="joinRoomBtn" type="button">Join</button>
                    <button id="spectateBtn" type="button" title="Watch a match without playing">Spectate</button>
                </div>
                <p id="onlineMessage" class="onlineMessage" role="status" aria-live="polite"></p>
            </div>
            <div id="onlineRoom" class="onlineCard" hidden>
                <p class="roomLabel">Room code</p>
                <p id="roomCodeText" class="roomCode" aria-live="polite"></p>
                <div class="roomActions">
                    <button id="copyCodeBtn" type="button">Copy code</button>
                    <button id="shareLinkBtn" type="button">Share link</button>
                </div>
                <ul class="seats">
                    <li id="seatYou"></li>
                    <li id="seatOpponent"></li>
                </ul>
                <p id="roomNote" class="onlineMessage" role="status" aria-live="polite"></p>
                <button id="leaveRoomBtn" type="button">Leave room</button>
            </div>
        </section>
        <!-- The 9 small boards (81 cells) are generated by UltimateTicTacToeLogic.js -->
        <div class="container" id="grid"></div>
        <h2 id="statusBar"></h2>
        <div class="controls">
            <button id="restartBtn" type="button">Reset</button>
            <button id="leaveBtn" type="button" hidden>Leave room</button>
            <button id="rematchBtn" type="button" hidden>Rematch</button>
            <button id="claimBtn" type="button" hidden>Claim the win</button>
            <a class="btn modeLink" href="BasicTicTacToe.html">Basic TicTacToe</a>
            <a class="btn" id="homeLink" href="index.html">Home</a>
            <button id="themeToggle" class="themeToggle" type="button"></button>
        </div>
    </main>
    <script src="Bot.js"></script>
    <script src="GameOptions.js"></script>
    <script src="MultiplayerCore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="MultiplayerClient.js"></script>
    <script src="Effects.js"></script>
    <script src="UltimateTicTacToeLogic.js"></script>
    <script src="OnlinePanel.js"></script>
</body>
</html>
